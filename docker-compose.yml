services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop_local_only
      POSTGRES_DB: brightloop
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - brightloop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brightloop -d brightloop']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  brightloop_pg:
